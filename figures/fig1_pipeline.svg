<text x="457.5" y="81" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">2. In-Country Browser Crawl</text>
<text x="337" y="112" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Vantage: In-country Vietnam IP</text>
<text x="337" y="131" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">Chrome 153 headless, vi-VN, 1366×768</text>
<text x="337" y="150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• Profile A (clean): load, 15s, no gesture</text>
<text x="337" y="169" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">   → requests, IPs, cookies, DOM, shot</text>
<text x="337" y="188" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• Profile B (clean): replicate, 15s</text>
<text x="337" y="207" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• Profile C (if reject btn): click, 15s</text>
<text x="337" y="226" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• Policy fetch: rendered DOM text</text>
<text x="337" y="245" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">──────────────────────────</text>
<text x="337" y="264" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Sensitivity &amp; reliability checks:</text>
<text x="337" y="283" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">sens30 (97), nomedia (98), W2 (107)</text>
<rect x="625" y="60" width="265" height="255" rx="8" fill="#F8FAFC" stroke="#009E73" stroke-width="1.8"/>
<path d="M 633 60 H 882 Q 890 60 890 68 V 92 H 625 V 68 Q 625 60 633 60 Z" fill="#009E73"/>
<text x="757.5" y="81" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">3. Attribution &amp; Verification</text>
<text x="637" y="112" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Strict ID (Protocol §3.3):</text>
<text x="637" y="131" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">3P cookie (&gt;24h, ≥8c) or URL (≥2 req)</text>
<text x="637" y="150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">differing across clean profiles A vs B</text>
<text x="637" y="169" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Extended ID (F10 sensitivity):</text>
<text x="637" y="188" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">+ Verified 1P→3P cookie-sync (GA4/FB)</text>
<text x="637" y="207" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Entity &amp; Geo Attribution:</text>
<text x="637" y="226" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">DDG + Disconnect + VN_SUPP (full host)</text>
<text x="637" y="245" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">Entity HQ (95.1%) vs DB-IP IP (99.7%)</text>
<text x="637" y="264" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Policy Cleaning &amp; Validation:</text>
<text x="637" y="283" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">363 raw → 331 valid; SimHash + EP κ</text>
<rect x="925" y="60" width="250" height="255" rx="8" fill="#FFF8F5" stroke="#D55E00" stroke-width="1.8"/>
<path d="M 933 60 H 1167 Q 1175 60 1175 68 V 92 H 925 V 68 Q 925 60 933 60 Z" fill="#D55E00"/>
<text x="1050.0" y="81" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">4. PDPL Evidentiary Ladder</text>
<text x="937" y="112" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">No &#x27;violation&#x27; conclusions drawn.</text>
<text x="937" y="131" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• B0 Observed: any 3P request (I1)</text>
<text x="937" y="150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• B1 Identifier-bearing: A≠B ID (I2)</text>
<text x="937" y="169" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• B2 Consent-relevant: B1 + Art. 2(1)</text>
<text x="937" y="188" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">   reading R + no Art. 19 exception</text>
<text x="937" y="207" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">   (I4 analytics, I6 Art. 20(1)(c))</text>
<text x="937" y="226" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• B3 Prima facie inconsistent:</text>
<text x="937" y="245" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">   B2 + advertising entity (I3/I8) +</text>
<text x="937" y="264" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">   no pre-flow consent [Art. 28(8)(a)]</text>
<text x="937" y="283" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Gate passed: W2 κ = 0.76–1.00</text>
