<text x="157.5" y="81" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">1. Deterministic Sampling Frame</text>
<text x="37" y="112" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">CrUX VN 2026-10 (315,227 origins)</text>
<text x="37" y="131" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">PSL eTLD+1 deduplication + blocklist</text>
<text x="37" y="150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• gov: census *.gov.vn top-50k (201)</text>
<text x="37" y="169" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• edu: random *.edu.vn top-10k (170)</text>
<text x="37" y="188" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• vn: random other *.vn top-10k (600)</text>
<text x="37" y="207" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">• nonvn: top-1k VI + VN signal (26)</text>
<text x="37" y="226" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">──────────────────────────</text>
<text x="37" y="245" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Crawl target: 997 registered domains</text>
<text x="37" y="264" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1E293B">Measured (A &amp; B OK): 946 (5.1% err)</text>
<text x="37" y="283" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E293B">Post-strata: TM, BC, GOV, EDU, GATED</text>
