<text x="600.0" y="34" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B365D">K7 Measurement Instrument and Four-Tier PDPL Evidentiary Pipeline</text>
