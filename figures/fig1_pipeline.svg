<text x="440" y="446" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">PDPL Art. 9(2)–(4), 11(1), 28(8)(b); Decree 356 Art. 6(1)–(3)</text>
<text x="815" y="446" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Descriptive (&lt;30 reject sites); B3 candidate for post-reject I8</text>
<text x="42" y="469" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">RQ3 Cross-Border Flows</text>
<text x="235" y="469" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">I6 (Entity HQ + DB-IP Lite)</text>
<text x="440" y="469" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">PDPL Art. 20(1)(b)–(c), 20(6)(a); Decree 356 Art. 17(1), 17(3)</text>
<text x="815" y="469" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Capped at B2 (TIA unobservable; GOV/press exemptions noted)</text>
<text x="42" y="492" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">RQ4 Policy &#x27;Say–Do&#x27; Gap</text>
<text x="235" y="492" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">P1–P12 (331 valid policies)</text>
<text x="440" y="492" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">PDPL Art. 4(1)(a), 9(2), 29(6); Decree 356 Art. 42(2) (D.13 repeal)</text>
<text x="815" y="492" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Descriptive transparency gap (no general statutory policy mandate)</text>
