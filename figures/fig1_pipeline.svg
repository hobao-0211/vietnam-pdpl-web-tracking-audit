<text x="235" y="423" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">I1–I5 (Strict &amp; F10 Ext)</text>
<text x="440" y="423" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">PDPL Art. 2(1), 9, 11(1), 28(8)(a); Decree 356 Art. 4(1)(l)</text>
<text x="815" y="423" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">Max B3 (ads) / B2 (analytics; B1 on GOV under Art. 19(1)(c))</text>
<text x="42" y="446" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" fill="#1E293B">RQ2 Consent &amp; Reject</text>
